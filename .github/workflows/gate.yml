# The gate, in CI. Before this file there was no CI at all: Render deployed every push to
# `main`, and on 2026-09-19 a textually clean merge broke the backend import and the iOS
# build at once, caught only by the failed deploy (docs/tracker/BLOCKERS.md, "Out-of-band").
#
#   backend        every push / PR   corpus validator + backend pytest (not live, not mongo)
#   ios-typecheck  every push / PR   scripts/typecheck-ios.sh + EditorCore `swift test`
#   ios-tests      manual + nightly  the full xcodebuild suite on a simulator, counts from
#                                    the result bundle (the console undercounts). Nightly
#                                    only when main gained a commit in the last 24 h
#                                    (nightly-gate), so a quiet night costs no macOS time.
#
# Render deploys main only after this workflow's checks pass (render.yaml
# autoDeployTrigger: checksPass). A skipped job counts as passing for Render, so
# ios-tests being skipped on push does not hold a deploy back.
#
# No secrets are used or needed. The env values below are dummy TEST values so the
# settings loader is satisfied; they are not credentials for anything.
name: gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # 07:17 UTC, about midnight US Pacific. Scheduled runs use the default branch.
    - cron: "17 7 * * *"

concurrency:
  group: gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    if: github.event_name != 'schedule' # the nightly run is ios-tests only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_BEARER_TOKEN: ci-dummy-bearer-token
      JWT_SECRET_KEY: ci-dummy-jwt-secret-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # render.yaml pins 3.12.6
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install the locked dependencies (what Render deploys)
        run: pip install -r backend/requirements.lock
      - name: requirements.lock still satisfies requirements.txt
        # The lock is regenerated by hand. If someone adds or raises a requirement in
        # requirements.txt without regenerating it, Render would deploy without it.
        run: |
          out="$(pip install --dry-run -r backend/requirements.txt 2>&1)"
          if echo "$out" | grep -q '^Would install'; then
            echo "$out" | grep '^Would install'
            echo "::error::backend/requirements.lock is stale: regenerate it (see its header)."
            exit 1
          fi
      - name: Corpus validator
        run: python backend/corpus/validate.py
      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -m "not live"

  ios-typecheck:
    if: github.event_name != 'schedule' # the nightly run is ios-tests only
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        id: xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          major="$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          # The project is maintained on Xcode 26.x (LastUpgradeCheck 2660). An older
          # toolchain fails in confusing ways (unknown SDK symbols), so say so plainly.
          if [ "$major" -lt 26 ]; then
            echo "::error::Runner Xcode is $(xcodebuild -version | head -1); this project needs Xcode 26+. Type-check skipped — this is a runner limitation, not a code failure. See docs/tracker/BLOCKERS.md."
            exit 1
          fi
      - name: Type-check all iOS targets (no simulator; NOT a build or a test run)
        run: scripts/typecheck-ios.sh
      - name: EditorCore tests (Foundation-only package)
        run: swift test --package-path tools/editorcore

  nightly-gate:
    # Cheap Linux check so the nightly run spends macOS minutes only when main moved.
    # macOS minutes bill at 10x on a private repo (docs/tracker/BLOCKERS.md, S11.46).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: Did main gain a commit in the last 24 hours?
        id: age
        run: |
          head_time="$(git log -1 --format=%ct HEAD)"
          age=$(( $(date +%s) - head_time ))
          if [ "$age" -lt 86400 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "main HEAD $(git rev-parse --short HEAD) is $((age / 3600)) h old: running the suite."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main HEAD $(git rev-parse --short HEAD) is $((age / 3600)) h old: already tested, skipping tonight."
          fi

  ios-tests:
    # Manual, plus nightly when main moved. A full simulator run is ~15 minutes of macOS
    # time and about one red run in three is environmental. Re-run once before believing
    # a red result. Never on push or pull_request: those stay as fast as before.
    needs: nightly-gate
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true'))
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          cat > "$RUNNER_TEMP/pick_sim.py" <<'PY'
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [
              (runtime, d)
              for runtime, ds in devices.items() if "iOS" in runtime
              for d in ds if d["name"].startswith("iPhone")
          ]
          # Newest runtime first; prefer a Pro model, which the project is tested on.
          iphones.sort(key=lambda p: (p[0], "Pro" in p[1]["name"]), reverse=True)
          runtime, device = iphones[0]
          sys.stderr.write("simulator: %s (%s)\n" % (device["name"], runtime))
          print(device["udid"])
          PY
          udid="$(xcrun simctl list devices available -j | python3 "$RUNNER_TEMP/pick_sim.py")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test -project escape_plan.xcodeproj -scheme escape_plan \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build-ci CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath ci.xcresult | tail -200
      - name: True counts from the result bundle
        if: always()
        run: |
          if [ -d ci.xcresult ]; then
            xcrun xcresulttool get test-results summary --path ci.xcresult | tee "$RUNNER_TEMP/summary.json"
            # The same counts on the run's summary page, so a nightly result reads at a glance.
            python3 - "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              s = json.load(open(sys.argv[1]))
          except ValueError:
              print("### iOS suite: xcresulttool could not read the result bundle (see the log)")
              sys.exit(0)
          print("### iOS suite: %s" % s.get("result", "?"))
          print("| total | passed | failed | skipped |\n|---|---|---|---|")
          print("| %s | %s | %s | %s |" % tuple(s.get(k, "?") for k in
                ("totalTestCount", "passedTests", "failedTests", "skippedTests")))
          for f in s.get("testFailures", []):
              print("- failed: `%s`" % f.get("testIdentifierString", "?"))
          PY
          else
            echo "::warning::no result bundle was produced"
            echo "### iOS suite: no result bundle was produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-xcresult
          path: ci.xcresult
          if-no-files-found: warn
