# Render.com blueprint — deploys the FastAPI backend from this monorepo.
# Human steps to go live are in backend/README.md § Deploy.
services:
  - type: web
    name: escape-plan-backend
    runtime: python
    plan: free
    rootDir: backend
    # requirements.lock is the exact-pinned freeze of requirements.txt, so a
    # deploy installs the versions CI tested rather than whatever is newest.
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Deploy a commit to main only after its GitHub checks pass (the `gate` workflow).
    # Without this Render deployed every push, and a merge that broke pytest reached
    # production on 2026-09-19 (AUD-037). Skipped jobs count as passing; zero checks or
    # any failed check means no deploy. The dashboard setting must agree: see BLOCKERS.
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: BACKEND_BEARER_TOKEN
        generateValue: true # Render generates a random token; copy it into the team password note
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard — never in git
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      # S8.1 cloud sync. Optional: leave MONGODB_URI unset and the backend runs
      # exactly as before, with /health/db reporting "disabled". sync:false
      # because the URI carries a password — set it in the Render dashboard,
      # never in git, and percent-escape the credentials (an unescaped '@' is
      # rejected by the driver; the layer then stays disabled and logs why).
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: escape_plan
      # S8.2 auth. generateValue so a strong secret exists without anyone
      # choosing one — the service refuses any secret under 32 bytes. Changing
      # it invalidates every issued token, which is the intended panic button.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TTL_MINUTES
        value: "60"
      # AI cost guard (backend/app/rate_limit.py): AI_RATE_PER_MIN (default 6),
      # AI_RATE_BURST (3) and AI_MAX_CONCURRENT (4) bound calls to /explain
      # /analyze /build /chat — per client IP, and in flight for everyone. Over
      # either limit is 429 + Retry-After. Deliberately not set here: the code
      # defaults apply until someone tunes them in the Render dashboard, and a
      # value in this file would overwrite that tuning on the next blueprint sync.
